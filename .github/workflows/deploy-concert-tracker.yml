name: Deploy Concert Tracker to GitHub Pages

on:
  push:
    branches: [master, claude/concert-tracker]
    paths:
      - 'concert-tracker/**'
      - '.github/workflows/deploy-concert-tracker.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: concert-tracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: concert-tracker/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Build
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          # Optional: add these as repository secrets (Settings → Secrets and variables → Actions)
          # to ship keys with the build. Users can also enter keys at runtime in the app's Settings page.
          VITE_TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      - name: SPA fallback
        run: cp dist/index.html dist/404.html
      # Publishes ./dist to the gh-pages branch. GitHub serves that branch at
      # https://<owner>.github.io/<repo>/ (Settings → Pages → Source: gh-pages / root).
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./concert-tracker/dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'Deploy concert tracker from ${{ github.sha }}'
