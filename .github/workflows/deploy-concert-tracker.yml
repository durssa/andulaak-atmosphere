name: Deploy Concert Tracker to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'apps/concert-tracker/**'
      - '.github/workflows/deploy-concert-tracker.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/concert-tracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/concert-tracker/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Base path: "/" for a custom domain or a <user>.github.io repo, otherwise "/<repo>/".
      # Set the repository variable PAGES_CUSTOM_DOMAIN (Settings → Secrets and variables → Actions → Variables)
      # to publish at your own domain; point a DNS CNAME for it at durssa.github.io.
      - name: Resolve site address
        id: site
        shell: bash
        run: |
          domain="${{ vars.PAGES_CUSTOM_DOMAIN }}"
          repo="${{ github.event.repository.name }}"
          if [ -n "$domain" ] || [[ "$repo" == *.github.io ]]; then base="/"; else base="/$repo/"; fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "cname=$domain" >> "$GITHUB_OUTPUT"
          echo "Site base path: $base ${domain:+(custom domain: $domain)}"
      - name: Build
        run: npm run build
        env:
          VITE_BASE: ${{ steps.site.outputs.base }}
          # Optional: add these as repository secrets (Settings → Secrets and variables → Actions)
          # to ship keys with the build. Users can also enter keys at runtime in the app's Settings page.
          VITE_TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          VITE_SEATGEEK_CLIENT_ID: ${{ secrets.SEATGEEK_CLIENT_ID }}
          VITE_SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - name: SPA fallback
        run: cp dist/index.html dist/404.html
      # Publishes ./dist to the gh-pages branch. GitHub serves that branch at
      # https://<owner>.github.io/<repo>/ (Settings → Pages → Source: gh-pages / root).
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apps/concert-tracker/dist
          publish_branch: gh-pages
          cname: ${{ steps.site.outputs.cname }}
          force_orphan: true
          commit_message: 'Deploy concert tracker from ${{ github.sha }}'
